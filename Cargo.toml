[package]
name = "plato-transform"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Data transformation pipeline for PLATO tiles"
repository = "https://github.com/SuperInstance/plato-transform"

[dev-dependencies]
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
